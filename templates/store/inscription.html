{% extends 'store/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <h3 class="fw-bold mb-4 text-center text-primary">Créer un compte</h3>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <!-- Chan imèl la nou ajoute manyèlman -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Adrès Imèl</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="Antre imèl ou pou resevwa kòd verifikasyon an">
                    </div>

                    {{ form.as_p }}
                    
                    <button type="submit" class="btn btn-primary w-100 rounded-3 mt-3">S'inscrire</button>
                </form>
                
                <p class="text-center mt-3 mb-0">
                    Déjà un compte? <a href="{% url 'connexion' %}">Se connecter</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
