{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <h3 class="fw-bold mb-4 text-center text-primary">Connexion</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 rounded-3 mt-3">Se connecter</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Pas encore de compte? <a href="{% url 'inscription' %}">S'inscrire</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
